	<script>
		// --- TESTING CONTROL ---
		// Pass a date string here to test (e.g., "2025-12-25" or "12/24/2025").
		// Leave null or empty to default to real-time today.
		const TEST_DATE_STRING = "";

		// Initialize the active date target
		const today = TEST_DATE_STRING ? new Date(TEST_DATE_STRING) : new Date();

		const state = {
			fetchedHTMLContent: ""
		};

		// Helper: Returns "YYYYMMDD"
		function getTodayDateString() {
			const year = today.getFullYear();
			const month = String(today.getMonth() + 1).padStart(2, '0');
			const day = String(today.getDate()).padStart(2, '0');
			return `${year}${month}${day}`;
		}

		// Helper: Returns "YYYY/MM/DD"
		function getTodayFormattedPath() {
			const year = today.getFullYear();
			const month = String(today.getMonth() + 1).padStart(2, '0');
			const day = String(today.getDate()).padStart(2, '0');
			return `${year}/${month}/${day}`;
		}

		// 1. Update DOM Date Display Header
		const dateElement = document.getElementById('current-date');
		if (dateElement) {
			const options = { month: 'long', day: 'numeric', weekday: 'long', year: 'numeric' };
			dateElement.textContent = today.toLocaleDateString(undefined, options);
		}

		// 2. Network Request
		async function fetchSourceHTML() {
			const dateStr = getTodayDateString();
			const fileName = `${dateStr}.html`;
			const targetUrl = `https://dcs.goarch.org/goa/dcs/indexes/${fileName}`;

			try {
				const response = await fetch(targetUrl);
				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}
				state.fetchedHTMLContent = await response.text();
			} catch (error) {
				console.error(`Could not fetch content from ${fileName}:`, error);
				state.fetchedHTMLContent = `<p style="color:red; font-weight:bold;">Error loading ${fileName} template asset.</p>`;
			}
		}

		// 3. Service Visibility Logic
		function updateServiceVisibility() {
			if (!state.fetchedHTMLContent) return;

			const matches = state.fetchedHTMLContent.match(/\/([a-z0-9]+)\//gi) || [];
			const foundServiceKeys = new Set(
				matches.map(match => match.replace(/\//g, '').toLowerCase())
			);

			const knownDivIds = ['ma', 'ma1', 'li', 'gh', 've', 'vl', 'pl', 'co', 'em', 'pl3'];

			knownDivIds.forEach(id => {
				const div = document.getElementById(id);
				if (!div) return;

				let shouldShow = false;

				if (id === 'pl' && foundServiceKeys.has('pl1')) {
					shouldShow = true;
				} else if ((id === 'em' || id === 'pl3') && foundServiceKeys.has('en')) {
					shouldShow = true;
				} else if (foundServiceKeys.has(id)) {
					shouldShow = true;
				}

				div.style.display = shouldShow ? 'block' : 'none';
			});
		}

		// 4. Update Link Hrefs
		function updateDateInHref() {
			const links = document.querySelectorAll('a');
			const formattedDatePath = getTodayFormattedPath();
			const dateRegex = /(\d{4}[-.\/]?\d{2}[-.\/]?\d{2})/;

			links.forEach(link => {
				const href = link.getAttribute('href');
				if (href) {
					const match = href.match(dateRegex);
					if (match) {
						const originalDate = match[1];
						link.setAttribute('href', href.replace(originalDate, formattedDatePath));
					}
				}
			});
		}

		// 5. Execution Entry Point
		document.addEventListener('DOMContentLoaded', async () => {
			updateDateInHref();
			await fetchSourceHTML();
			updateServiceVisibility();
		});
	</script>
